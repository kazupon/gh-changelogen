name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CI: true
  VITE_GIT_HOOKS: '0'

permissions:
  contents: read

jobs:
  toolchain:
    name: Vite+ toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout codes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Detect dead code
        run: vp run deadcode

      - name: Pack library
        run: vp pack

      - name: Validate Vite build
        run: vp build

      - name: Pack npm tarball
        run: |
          mkdir -p package-artifacts
          npm pack --pack-destination package-artifacts

      - name: Smoke test package on Node.js 24
        run: node scripts/package-smoke.mjs package-artifacts/gh-changelogen-*.tgz

      - name: Upload npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: npm-package
          path: package-artifacts/*.tgz

  consumer-smoke:
    name: Consumer smoke (Node.js ${{ matrix.node }})
    needs:
      - toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - name: Checkout codes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Download npm tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package-artifacts

      - name: Smoke test package
        run: node scripts/package-smoke.mjs package-artifacts/gh-changelogen-*.tgz
