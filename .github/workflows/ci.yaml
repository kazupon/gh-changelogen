name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CI: true
  VITE_GIT_HOOKS: '0'

permissions:
  contents: read

jobs:
  toolchain:
    name: Vite+ toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vpr check

      - name: Test
        run: vpr test

      - name: Pack library
        run: vp pack

      - name: Validate Vite build
        run: vp build

      - name: Pack npm tarball
        run: |
          mkdir -p package-artifacts
          npm pack --pack-destination package-artifacts

      - name: Smoke test package on Node.js 24
        run: node scripts/package-smoke.mjs package-artifacts/gh-changelogen-*.tgz

      - name: Upload npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: npm-package
          path: package-artifacts/*.tgz

  consumer-smoke:
    name: Consumer smoke (Node.js ${{ matrix.node }})
    needs:
      - toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Download npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package-artifacts

      - name: Smoke test package
        run: node scripts/package-smoke.mjs package-artifacts/gh-changelogen-*.tgz
